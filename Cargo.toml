[package]
name = "qqman-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Manhattan and Q-Q plots for GWAS results: a Rust port of the R package qqman."
license = "GPL-3.0-only"
repository = "https://github.com/MRCIEU/qqman-rs"

[[bin]]
name = "qqman"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
rs-graphics = { git = "ssh://git@github.com/MRCIEU/rs-graphics.git", rev = "65d0c584bb6a07de3988b5dba3f7370be0b9ef3e", version = "0.1.0-pre" }

[profile.release]
lto = true
codegen-units = 1
