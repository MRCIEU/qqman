[package]
name = "qqman"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Manhattan and Q-Q plots for GWAS results: a Rust port of the R package qqman."
license = "GPL-3.0-only"
repository = "https://github.com/MRCIEU/qqman"

[[bin]]
name = "qqman"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
rs-graphics = { git = "https://github.com/MRCIEU/rs-graphics.git", tag = "v0.5.0", version = "0.5" }

[profile.release]
lto = true
codegen-units = 1
